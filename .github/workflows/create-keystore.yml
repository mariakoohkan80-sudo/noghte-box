name: Create Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore noghtebox.keystore -alias noghtebox -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Noghte Box, O=Noghte Box, C=IR"
          base64 -w0 noghtebox.keystore > keystore.base64.txt
          printf "alias: noghtebox\npassword: %s\n" "$PASS" > info.txt
          mkdir out
          mv noghtebox.keystore keystore.base64.txt info.txt out/

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: out
          retention-days: 1

name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: npm run prepare-web

      - name: Add Android project
        run: npx cap add android

      - name: Generate icons
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#1E2A5A" --iconBackgroundColorDark "#1E2A5A"

      - name: Sync
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out noghte-box-release.apk aligned.apk
          "$BT/apksigner" verify noghte-box-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: noghte-box-release-apk
          path: noghte-box-release.apk
